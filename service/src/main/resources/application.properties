spring.application.name=cashback-claims-ledger
server.port=${PORT:8790}
spring.graphql.http.path=/graphql
spring.graphql.schema.inspection.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Settings live in config/; these only choose where state lives.
cashback.config-dir=${CASHBACK_CONFIG_DIR:config}
cashback.store=${CASHBACK_STORE:memory}
cashback.database-url=${DATABASE_URL:}
cashback.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
cashback.dynamodb.table=${DYNAMODB_TABLE:cashback-ledger}
cashback.dynamodb.create-table=${DYNAMODB_CREATE_TABLE:false}
cashback.sqs.queue-url=${SQS_QUEUE_URL:}
cashback.sqs.endpoint=${SQS_ENDPOINT:}
cashback.demo=${CASHBACK_DEMO:true}
